<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Builder</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#2563eb;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#9aa3af;--ac:#60a5fa;--bd:#2a2f38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px}
.c{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mu);margin:0 0 14px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.5}
#log{margin-top:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
a{color:var(--ac)}
details{margin-top:12px;font-size:14px}summary{color:var(--mu)}
</style>
</head>
<body>
<div class="c">
<h1>APK Builder</h1>
<p>Upload zip proyek Gradle, tunggu, lalu unduh APK dan log.</p>
<label>File zip proyek</label><input id="zip" type="file" accept=".zip">
<button id="go">Upload &amp; Build</button>
<div id="log"></div>
<details><summary>Pengaturan</summary>
<label>Repo (pemilik/nama)</label><input id="repo" placeholder="username/apk-builder">
<label>Branch</label><input id="ref" value="main">
<label>File workflow</label><input id="wf" value="build.yml">
<label>Token GitHub (Contents &amp; Actions: read/write)</label><input id="tok" type="password" placeholder="github_pat_...">
</details>
</div>
<script>
const $=id=>document.getElementById(id),log=m=>$('log').innerHTML=m,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const K=['repo','ref','wf','tok'];
try{for(const k of K){const v=localStorage.getItem('apk_'+k);if(v)$(k).value=v}}catch(e){}
const api=(p,o={})=>fetch('https://api.github.com/repos/'+$('repo').value.trim()+p,{...o,headers:{Authorization:'Bearer '+$('tok').value.trim(),Accept:'application/vnd.github+json','Content-Type':'application/json'}});
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('Gagal membaca file'));r.readAsDataURL(f)});
async function dl(id,name){
 const z=await api('/actions/artifacts/'+id+'/zip');
 if(!z.ok){alert('Unduh gagal ('+z.status+')');return}
 const a=document.createElement('a');a.href=URL.createObjectURL(await z.blob());a.download=name+'.zip';a.click();
}
window.dl=dl;
$('go').onclick=async()=>{
 const f=$('zip').files[0];
 if(!f){log('Pilih file zip dulu.');return}
 if(!$('repo').value||!$('tok').value){log('Isi repo dan token di Pengaturan.');return}
 const b=$('go');b.disabled=true;
 try{for(const k of K)localStorage.setItem('apk_'+k,$(k).value)}catch(e){}
 try{
  const ref=$('ref').value.trim(),path='/contents/upload/project.zip';
  log('Mengunggah zip...');
  let sha;
  const ex=await api(path+'?ref='+encodeURIComponent(ref));
  if(ex.ok)sha=(await ex.json()).sha;
  const put=await api(path,{method:'PUT',body:JSON.stringify({message:'upload project.zip',content:await b64(f),branch:ref,sha})});
  if(!put.ok)throw new Error('Upload gagal ('+put.status+'): '+(await put.text()));
  const t0=Date.now()-5000;
  log('Memicu build...');
  const d=await api('/actions/workflows/'+$('wf').value.trim()+'/dispatches',{method:'POST',body:JSON.stringify({ref})});
  if(d.status!==204)throw new Error('Gagal memicu ('+d.status+'): '+(await d.text()));
  let run=null;
  for(let i=0;i<45&&!run;i++){
   await sleep(3000);
   const j=await(await api('/actions/workflows/'+$('wf').value.trim()+'/runs?event=workflow_dispatch&per_page=5')).json();
   run=(j.workflow_runs||[]).find(x=>new Date(x.created_at).getTime()>=t0);
  }
  if(!run)throw new Error('Run tidak ditemukan.');
  let x;
  while(true){
   x=await(await api('/actions/runs/'+run.id)).json();
   log('Status: '+x.status+(x.conclusion?' ('+x.conclusion+')':'')+'\n<a href="'+x.html_url+'" target="_blank">Lihat di GitHub</a>');
   if(x.status==='completed')break;
   await sleep(3000);
  }
  const a=await(await api('/actions/runs/'+run.id+'/artifacts')).json();
  const links=(a.artifacts||[]).map(r=>'<button onclick="dl('+r.id+',\''+r.name+'\')">Unduh '+(r.name==='apk'?'APK':'Log')+'</button>').join('');
  log((x.conclusion==='success'?'Build berhasil.':'Build gagal, cek log.')+'\n(zip hasil unduhan berisi file .apk / build.log)'+links);
 }catch(e){log('Error: '+e.message)}
 b.disabled=false;
};
</script>
</body>
</html>
